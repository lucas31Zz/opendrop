[package]
name = "opendrop"
version = "1.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# One instance per machine: a second launch never gets to create a window
# (nor touch the engine) - it hands off to the running instance, which
# re-shows its window, possibly from the tray. Registered FIRST in main().
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
# Update digest check: GitHub writes `"sha256:<hex>"` next to each asset,
# and the installer is only run after the downloaded bytes hash to it.
sha2 = "0.10"
# Standard Windows folder picker (IFileOpenDialog + FOS_PICKFOLDERS) -
# the "basic" one every app shows, instead of the PowerShell
# FolderBrowserDialog whose Win11 render the author rejected.
rfd = "0.15"

[profile.release]
strip = true
