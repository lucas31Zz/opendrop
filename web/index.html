<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Deterministic background while the page loads or the browser shows
         its own error page, instead of whatever the phone theme is. -->
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f0f0f">
    <title>OpenDrop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Light/dark. Follows the desktop app's choice unless this device
         overrides it; the icon shows the theme a tap switches to. -->
    <button id="theme-toggle" class="theme-toggle" type="button"
            title="Switch theme" aria-label="Switch theme">&#9788;</button>

    <div class="container">
        <div class="logo">
            <span class="logo-icon">&#128229;</span>
            <h1>OpenDrop</h1>
        </div>

        <div id="app">
            <div class="quota-bar" id="quota-bar" style="display:none;">
                <div class="quota-track" id="quota-track" style="display:none;">
                    <div class="quota-fill" id="quota-fill"></div>
                </div>
                <span class="quota-text" id="quota-text"></span>
            </div>

            <div class="tabs" id="tabs">
                <!-- Slides between the two tabs on a spring, instead of
                     the background jumping from one side to the other. -->
                <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
                <button class="tab active" data-tab="send" data-i18n="tab.send">Send</button>
                <button class="tab" data-tab="receive" data-i18n="tab.receive">Download</button>
            </div>

            <div class="tab-content" id="tab-send">
                <div class="drop-zone" id="drop-zone">
                    <div class="drop-zone-content">
                        <span class="drop-icon">&#128194;</span>
                        <p data-i18n="drop.choose">Choose a file</p>
                        <p class="drop-hint" data-i18n="drop.hint">or drop it here</p>
                    </div>
                    <input type="file" id="file-input">
                </div>

                <div class="transfer-info" id="transfer-info" style="display:none;">
                    <p class="filename" id="filename"></p>
                    <p class="filesize" id="filesize"></p>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <p class="progress-text" id="progress-text">0%</p>
                    <button class="btn-cancel" id="btn-cancel" data-i18n="transfer.cancel">Cancel</button>
                </div>

                <div class="success-msg" id="success-msg" style="display:none;">
                    <span class="success-icon">&#9989;</span>
                    <p class="success-title" data-i18n="success.title">Transfer complete</p>
                    <p class="success-filename" id="success-filename"></p>
                    <p class="success-size" id="success-size"></p>
                    <p class="success-hash" id="success-hash"></p>
                    <button class="btn-new" id="btn-new" data-i18n="success.new">Send another file</button>
                </div>

                <div class="error-msg" id="error-msg" style="display:none;">
                    <span class="error-icon">&#10060;</span>
                    <p class="error-title" data-i18n="error.title">Error</p>
                    <p class="error-detail" id="error-detail"></p>
                    <button class="btn-new" id="btn-retry" data-i18n="error.retry">Try again</button>
                </div>
            </div>

            <div class="tab-content" id="tab-receive" style="display:none;">
                <div class="file-list" id="file-list">
                    <p class="loading" data-i18n="files.loading">Loading...</p>
                </div>
                <div class="empty-msg" id="empty-msg" style="display:none;">
                    <p data-i18n="files.empty">No files available.</p>
                    <p class="empty-hint" data-i18n="files.emptyHint">Put files in the Share folder on the PC.</p>
                </div>
                <button class="btn-refresh" id="btn-refresh" data-i18n="files.refresh">Refresh</button>
            </div>
        </div>

        <div class="session-screen" id="session-screen" style="display:none;">
            <span class="session-icon">&#128274;</span>
            <p class="session-title" data-i18n="session.locked">Session locked</p>
            <p class="session-detail" id="session-detail"></p>
            <p class="empty-hint" data-i18n="session.scanHint">Scan the QR code shown on the PC, or enter the session code.</p>

            <div class="unlock-form">
                <input type="text" class="code-input" id="code-input" placeholder="ABC123"
                       maxlength="12" autocomplete="off" autocapitalize="characters"
                       autocorrect="off" spellcheck="false" data-i18n-attr="aria-label:session.codeAria"
                       aria-label="Session code">
                <button class="btn-unlock" id="btn-unlock" data-i18n="session.unlock">Unlock</button>
            </div>
            <p class="unlock-error" id="unlock-error" style="display:none;"></p>

            <button class="btn-scan" id="btn-scan" style="display:none;" data-i18n="session.scan">&#128247; Scan QR code</button>
            <div class="scanner" id="scanner" style="display:none;">
                <video id="scanner-video" playsinline autoplay muted></video>
                <button class="btn-refresh" id="btn-scan-close" data-i18n="session.closeScanner">Close scanner</button>
            </div>

            <button class="btn-refresh" id="btn-session-retry" data-i18n="session.retry">Try again</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
