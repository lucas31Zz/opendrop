<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDrop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="logo-icon">&#128229;</span>
            <h1>OpenDrop</h1>
        </div>

        <div id="app">
            <div class="quota-bar" id="quota-bar" style="display:none;">
                <span class="quota-text" id="quota-text"></span>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="send">Envoyer</button>
                <button class="tab" data-tab="receive">Telecharger</button>
            </div>

            <div class="tab-content" id="tab-send">
                <div class="drop-zone" id="drop-zone">
                    <div class="drop-zone-content">
                        <span class="drop-icon">&#128194;</span>
                        <p>Choisir un fichier</p>
                        <p class="drop-hint">ou glisser ici</p>
                    </div>
                    <input type="file" id="file-input">
                </div>

                <div class="transfer-info" id="transfer-info" style="display:none;">
                    <p class="filename" id="filename"></p>
                    <p class="filesize" id="filesize"></p>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <p class="progress-text" id="progress-text">0%</p>
                    <button class="btn-cancel" id="btn-cancel">Annuler</button>
                </div>

                <div class="success-msg" id="success-msg" style="display:none;">
                    <span class="success-icon">&#9989;</span>
                    <p class="success-title">Transfert termin&#233;</p>
                    <p class="success-filename" id="success-filename"></p>
                    <p class="success-size" id="success-size"></p>
                    <p class="success-hash" id="success-hash"></p>
                    <button class="btn-new" id="btn-new">Envoyer un autre fichier</button>
                </div>

                <div class="error-msg" id="error-msg" style="display:none;">
                    <span class="error-icon">&#10060;</span>
                    <p class="error-title">Erreur</p>
                    <p class="error-detail" id="error-detail"></p>
                    <button class="btn-new" id="btn-retry">R&#233;essayer</button>
                </div>
            </div>

            <div class="tab-content" id="tab-receive" style="display:none;">
                <div class="file-list" id="file-list">
                    <p class="loading">Chargement...</p>
                </div>
                <div class="empty-msg" id="empty-msg" style="display:none;">
                    <p>Aucun fichier disponible.</p>
                    <p class="empty-hint"> Mets des fichiers dans le dossier Partage sur le PC.</p>
                </div>
                <button class="btn-refresh" id="btn-refresh">Rafraichir</button>
            </div>
        </div>

        <div class="session-screen" id="session-screen" style="display:none;">
            <span class="session-icon">&#128274;</span>
            <p class="session-title">Session verrouill&#233;e</p>
            <p class="session-detail" id="session-detail"></p>
            <p class="empty-hint">Scannez le QR code affich&#233; sur le PC, ou saisissez le code de session.</p>

            <div class="unlock-form">
                <input type="text" class="code-input" id="code-input" placeholder="ABC123"
                       maxlength="12" autocomplete="off" autocapitalize="characters"
                       autocorrect="off" spellcheck="false" aria-label="Code de session">
                <button class="btn-unlock" id="btn-unlock">D&#233;verrouiller</button>
            </div>
            <p class="unlock-error" id="unlock-error" style="display:none;"></p>

            <button class="btn-scan" id="btn-scan" style="display:none;">&#128247; Scanner le QR code</button>
            <div class="scanner" id="scanner" style="display:none;">
                <video id="scanner-video" playsinline autoplay muted></video>
                <button class="btn-refresh" id="btn-scan-close">Fermer le scanner</button>
            </div>

            <button class="btn-refresh" id="btn-session-retry">R&#233;essayer</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
