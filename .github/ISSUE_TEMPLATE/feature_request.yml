name: "Suggest a feature"
description: An idea for an improvement or a new need.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: usage
    attributes:
      label: Real-world use
      description: What concrete problem would this feature solve?
      placeholder: |
        As a ..., I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Desired behavior, UI if it's relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you do today.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether the issue already exists
          required: true
        - label: I'm happy to discuss this before writing any code (see CONTRIBUTING.md)
          required: true
