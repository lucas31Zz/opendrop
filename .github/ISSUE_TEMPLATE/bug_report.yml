name: "Report a bug"
description: Unexpected behavior, an error, a crash.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, OpenDrop version, desktop app or server only.
      placeholder: |
        Windows 11, Python 3.12.10, OpenDrop 0.1.0, desktop app
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As precisely as possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: "Error messages and server logs (tokens are already masked there: token=***)."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether the issue already exists
          required: true
        - label: I am not reporting a security vulnerability here (see the Security tab)
          required: true
