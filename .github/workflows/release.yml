name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows setup (win-x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the Tauri application (release)
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # custom-protocol = embedded assets instead of devUrl (see desktop.yml)
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete the bundle (Tauri binary + web + Python server + docs)
        shell: bash
        run: |
          set -e
          mkdir -p publish/win
          cp desktop/src-tauri/target/release/opendrop.exe publish/win/OpenDrop.exe
          cp -R web publish/win/web
          cp pyproject.toml requirements.txt README.md LICENSE SECURITY.md publish/win/
          cp -R src publish/win/src
          cp packaging/windows/install-deps.ps1 publish/win/
          test -f publish/win/web/index.html
          test -f publish/win/src/opendrop/main.py

      - name: Offline wheels (installer dependencies)
        shell: pwsh
        run: |
          # Wheels per minor version: pillow/cffi depend on the ABI, so the
          # installer must work with any installed Python 3.10+.
          foreach ($v in "3.10", "3.11", "3.12", "3.13", "3.14") {
            python -m pip download --requirement requirements.txt `
              --dest publish/win/wheels --only-binary=:all: --python-version $v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compile setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ github.ref_name }}" `
            "packaging\windows\OpenDrop.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive the portable version
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win `
            -DestinationPath "dist/OpenDrop-${{ github.ref_name }}-win-x64.zip"

      - name: Attach the files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          if [ -n "$notes" ]; then printf '%s\n' "$notes" > release-notes.md; fi
          for i in 1 2 3; do
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "OpenDrop ${{ github.ref_name }}" --generate-notes ${notes:+--notes-file release-notes.md} || sleep 5
          done
          files=$(find dist -maxdepth 1 -type f); gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber $files

  linux:
    name: Linux install (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Order matters: ../dist is embedded into the binary at compile time
      # (tauri.conf.json frontendDist), so the web assets come first.
      - name: Build the web assets (release)
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Build the Tauri binary (release)
        working-directory: desktop/src-tauri
        # custom-protocol = embedded assets instead of devUrl (see desktop.yml)
        run: cargo build --release --features tauri/custom-protocol

      - name: Stage the Tauri binary as OpenDrop
        run: |
          mkdir -p publish/linux
          cp desktop/src-tauri/target/release/opendrop publish/linux/OpenDrop
          chmod +x publish/linux/OpenDrop

      # build-tarball.sh downloads the wheels itself - the job needs no
      # wheels step (it never had one).
      - name: Assemble the tarball (binary + src + wheels + install.sh)
        run: bash packaging/linux/build-tarball.sh "${{ github.ref_name }}"

      - name: Attach the files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          if [ -n "$notes" ]; then printf '%s\n' "$notes" > release-notes.md; fi
          for i in 1 2 3; do
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "OpenDrop ${{ github.ref_name }}" --generate-notes ${notes:+--notes-file release-notes.md} || sleep 5
          done
          files=$(find dist -maxdepth 1 -type f); gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber $files
