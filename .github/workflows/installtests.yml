name: installtests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Install test (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the Tauri application (release)
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # custom-protocol = embedded assets instead of devUrl (see desktop.yml)
          cargo build --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete the bundle (Tauri binary + web + Python server + docs)
        shell: bash
        run: |
          set -e
          mkdir -p publish/win
          cp desktop/src-tauri/target/release/opendrop.exe publish/win/OpenDrop.exe
          cp -R web publish/win/web
          cp pyproject.toml requirements.txt README.md LICENSE SECURITY.md publish/win/
          cp -R src publish/win/src
          cp packaging/windows/install-deps.ps1 publish/win/
          test -f publish/win/web/index.html
          test -f publish/win/src/opendrop/main.py

      - name: Offline wheels (installer dependencies)
        shell: pwsh
        run: |
          # Wheels per minor version: pillow/cffi depend on the ABI, so the
          # installer must work with any installed Python 3.10+.
          foreach ($v in "3.10", "3.11", "3.12", "3.13", "3.14", "3.15") {
            python -m pip download --requirement requirements.txt `
              --dest publish/win/wheels --only-binary=:all: --python-version $v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Current version (from pyproject.toml)
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compile setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "packaging\windows\OpenDrop.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the previous release (v0.16.0 base)
        shell: pwsh
        run: |
          # curl.exe, not the pwsh `curl` alias (Invoke-WebRequest has no -f).
          # A truncated 116MB download sails past the >=1MB floor and then
          # kills Inno with exit 2 (fatal error while decompressing) - seen
          # as a same-commit flake (run 39406781200 green / 39406782225 red).
          # GitHub publishes the official SHA256 per asset; verify it and
          # retry until the file is byte-perfect.
          $want = "1a1b10b2966e11f65358f5e918de805544c18febc758e0fd83499aeee1ab1b36"
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            & curl.exe -fsSL "https://github.com/${{ github.repository }}/releases/download/v0.16.0/OpenDrop-v0.16.0-win-x64-setup.exe" -o dist\old.exe
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::download attempt $i failed (curl exit $LASTEXITCODE)"; continue }
            if (-not (Test-Path dist\old.exe)) { Write-Host "::warning::download attempt $i produced no file"; continue }
            $sz = (Get-Item dist\old.exe).Length
            if ($sz -lt 1MB) { Write-Host "::warning::download attempt $i suspiciously small: $sz bytes"; continue }
            $h = (Get-FileHash dist\old.exe -Algorithm SHA256).Hash.ToLower()
            Write-Host "download attempt ${i}: $sz bytes sha256=$h"
            if ($h -ne $want) { Write-Host "::warning::download attempt $i digest mismatch (truncated), retrying"; continue }
            $ok = $true
            break
          }
          if (-not $ok) { Write-Host "::error::no byte-perfect v0.16.0 base setup after 3 attempts"; exit 1 }
          Write-Host "downloaded v0.16.0 base: byte-perfect ($want)"

      # The base v0.16.0 installer is FROZEN: its offline wheels cover
      # CPython 3.10-3.14, and its install-deps.ps1 picks the interpreter
      # as `py -3` (the NEWEST on the machine), then `python`. Runner
      # image win25-vs2026/20261021 shipped 3.15: the launcher picked it,
      # venv creation succeeded, and the offline pip then found no cp315
      # wheel (pillow/cffi are ABI wheels) - the setup exited 2 (run
      # 40773806613; the last green run, 2026-10-20, was on the previous
      # image). CI pins 3.12 above, so shadow `py`: the installer can
      # only ever see that one interpreter.
      - name: Pin the Python the base installer may use (wheels cover 3.10-3.14)
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $v = & $py -c "import sys; print('%d.%d' % sys.version_info[:2])"
          if ($LASTEXITCODE -ne 0 -or "$v" -ne "3.12") {
            Write-Host "::error::the pinned python is '$v' (expected 3.12 from setup-python)"
            exit 1
          }
          $shim = Join-Path $env:RUNNER_TEMP "py-shim"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          # install-deps.ps1 only ever calls the launcher as `py -3
          # <args>` ($pyArgs = @("-3")), so drop %1 and forward the rest:
          # cmd's %* is immune to `shift`, hence the positional form.
          $line = '@echo off' + "`r`n" + '"' + $py + '" %2 %3 %4 %5 %6 %7 %8 %9'
          Set-Content -Path (Join-Path $shim "py.cmd") -Value $line -Encoding ascii
          # GITHUB_PATH entries are prepended for the next steps, so this
          # shadows System32's py.exe (Get-Command py -> the shim). Only
          # this job's PATH changes; the runner is ephemeral.
          Add-Content -Path $env:GITHUB_PATH -Value $shim
          Write-Host "shadowed 'py' with the pinned $v ($py)"

      - name: Install the base v0.16.0 and assert
        shell: pwsh
        run: |
          $app = "${env:ProgramFiles(x86)}\OpenDrop"
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenDrop\OpenDrop.lnk"
          $reg = 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{2E6B1C1B-5C2F-4A87-9E3D-8B5A0C7F4D62}_is1'
          # Inno Setup is a GUI-subsystem exe: pwsh's & does NOT wait for it
          # (observed: LASTEXITCODE stayed null and the step died while the
          # installer was still running). Start-Process -Wait observes the
          # real process exit code.
          $p = Start-Process -FilePath (Resolve-Path dist\old.exe).Path -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::v0.16.0 setup exited $($p.ExitCode)"; exit 1 }
          $dv = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue).DisplayVersion
          if ($dv -ne 'v0.16.0') { Write-Host "::error::DisplayVersion='$dv', expected 'v0.16.0'"; exit 1 }
          foreach ($p in @("$app\OpenDrop.exe", "$app\venv\Scripts\python.exe", $lnk)) {
            if (-not (Test-Path $p)) { Write-Host "::error::missing after base install: $p"; exit 1 }
          }
          # Self-documenting: the venv must be the PINNED interpreter, not
          # whatever the image newest happens to be (see the pin step).
          $vv = & "$app\venv\Scripts\python.exe" --version
          Write-Host "base venv python: $vv"
          if ("$vv" -notlike "Python 3.12*") {
            Write-Host "::error::base venv built on '$vv', expected the pinned 3.12"
            exit 1
          }
          Write-Host "base v0.16.0 OK: exe + venv($vv) + shortcut, DisplayVersion=v0.16.0"

      - name: Seed user data (upgrade marker + receive/share folders)
        id: seed
        shell: pwsh
        run: |
          $data = "$env:LOCALAPPDATA\OpenDrop"
          $recv = "$env:USERPROFILE\Downloads\OpenDrop\ci-recv"
          $share = "$env:USERPROFILE\Downloads\OpenDrop\ci-share"
          New-Item -ItemType Directory -Force -Path $data, $recv, $share | Out-Null
          $cfg = @{
            language = "en"
            ci_marker = "upgrade-from-0.16.0"
            download_directory = $recv
            share_directory = $share
          } | ConvertTo-Json
          Set-Content -Path "$data\config.json" -Value $cfg -Encoding utf8
          Set-Content -Path "$data\marker.txt" -Value "foreign file must survive uninstall" -Encoding utf8
          Set-Content -Path "$recv\seed.txt" -Value "seed" -Encoding utf8
          Set-Content -Path "$share\seed.txt" -Value "seed" -Encoding utf8
          "cfg_hash=$((Get-FileHash "$data\config.json").Hash)" >> $env:GITHUB_OUTPUT
          Write-Host "seeded config marker + foreign marker.txt + receive/share seeds"

      - name: Upgrade install (current over the base) + assert
        shell: pwsh
        run: |
          $app = "${env:ProgramFiles(x86)}\OpenDrop"
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenDrop\OpenDrop.lnk"
          $reg = 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{2E6B1C1B-5C2F-4A87-9E3D-8B5A0C7F4D62}_is1'
          $p = Start-Process -FilePath (Resolve-Path "dist\OpenDrop-${{ steps.ver.outputs.version }}-win-x64-setup.exe").Path -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::current setup exited $($p.ExitCode)"; exit 1 }
          $dv = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue).DisplayVersion
          if ($dv -ne '${{ steps.ver.outputs.version }}') { Write-Host "::error::DisplayVersion='$dv', expected '${{ steps.ver.outputs.version }}'"; exit 1 }
          $h = (Get-FileHash "$env:LOCALAPPDATA\OpenDrop\config.json").Hash
          if ($h -ne '${{ steps.seed.outputs.cfg_hash }}') { Write-Host "::error::config.json changed across the upgrade ($h)"; exit 1 }
          foreach ($p in @("$app\OpenDrop.exe", "$app\venv\Scripts\python.exe", $lnk)) {
            if (-not (Test-Path $p)) { Write-Host "::error::missing after upgrade: $p"; exit 1 }
          }
          Write-Host "upgraded to ${{ steps.ver.outputs.version }}: config byte-identical, exe + venv + shortcut present"

      - name: Silent uninstall + assert artifacts gone, user data rules
        shell: pwsh
        run: |
          $app = "${env:ProgramFiles(x86)}\OpenDrop"
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenDrop\OpenDrop.lnk"
          $reg = 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{2E6B1C1B-5C2F-4A87-9E3D-8B5A0C7F4D62}_is1'
          $p = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::uninstaller exited $($p.ExitCode)"; exit 1 }
          foreach ($p in @(
            "$app\OpenDrop.exe",
            "$app\venv\Scripts\python.exe",
            $lnk,
            "$env:LOCALAPPDATA\OpenDrop\config.json"
          )) {
            if (Test-Path $p) { Write-Host "::error::should be gone after uninstall: $p"; exit 1 }
          }
          if (Test-Path $reg) { Write-Host "::error::uninstall registry key still present"; exit 1 }
          if (Test-Path $app) { Write-Host "::error::app dir still present: $app"; exit 1 }
          foreach ($p in @(
            "$env:LOCALAPPDATA\OpenDrop\marker.txt",
            "$env:USERPROFILE\Downloads\OpenDrop\ci-recv\seed.txt",
            "$env:USERPROFILE\Downloads\OpenDrop\ci-share\seed.txt"
          )) {
            if (-not (Test-Path $p)) { Write-Host "::error::must survive uninstall: $p"; exit 1 }
          }
          Write-Host "uninstall clean: artifacts gone, config removed, foreign marker + receive/share intact"

      - name: Reinstall cycle + assert
        shell: pwsh
        run: |
          $app = "${env:ProgramFiles(x86)}\OpenDrop"
          $reg = 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{2E6B1C1B-5C2F-4A87-9E3D-8B5A0C7F4D62}_is1'
          $p = Start-Process -FilePath (Resolve-Path "dist\OpenDrop-${{ steps.ver.outputs.version }}-win-x64-setup.exe").Path -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::reinstall exited $($p.ExitCode)"; exit 1 }
          $dv = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue).DisplayVersion
          if ($dv -ne '${{ steps.ver.outputs.version }}') { Write-Host "::error::DisplayVersion='$dv' after reinstall"; exit 1 }
          if (-not (Test-Path "$app\OpenDrop.exe")) { Write-Host "::error::exe missing after reinstall"; exit 1 }
          Write-Host "reinstall cycle OK: exit 0, DisplayVersion=${{ steps.ver.outputs.version }}, exe present"

      # Review Focus 1: the installed app must actually start its engine.
      # Strict on purpose - if the runner cannot host the GUI, this fails
      # loudly on the first CI run instead of shipping a launcher nobody
      # has ever seen run.
      #
      # NOTE on the assertion: `__opendrop_info__` is the ENGINE'S STDOUT
      # handshake (main.py), which the desktop app reads through a pipe -
      # it never appears in the HTTP body. `/api/info` answers JSON
      # (`ip`, `port`, `lang`, `theme`), so THAT is what proves the
      # engine is up and serving.
      - name: Installed-app smoke (spawn the engine, poll /api/info)
        shell: pwsh
        run: |
          $exe = "${env:ProgramFiles(x86)}\OpenDrop\OpenDrop.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::no installed exe: $exe"; exit 1 }
          $p = Start-Process $exe -PassThru
          Write-Host "started $exe (PID $($p.Id))"
          $body = $null
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -SkipCertificateCheck -UseBasicParsing -TimeoutSec 5 https://127.0.0.1:8080/api/info
              $j = $r.Content | ConvertFrom-Json
              if ($null -ne $j.ip -and $null -ne $j.port) { $body = $r.Content; break }
            } catch { Write-Host "  attempt ${i}: $($_.Exception.Message)" }
          }
          # Capture the state BEFORE killing it, or every failure would
          # read "exited early" just because we stopped it ourselves.
          $earlyCode = $null
          if ($p.HasExited) { $earlyCode = $p.ExitCode }
          taskkill /PID $p.Id /F /T 2>$null | Out-Null
          if (-not $body) {
            Write-Host "::error::engine never answered on 127.0.0.1:8080 within 60s"
            if ($null -ne $earlyCode) { Write-Host "::error::the app exited early with code $earlyCode" }
            exit 1
          }
          Write-Host "installed-app smoke OK: $body"
          exit 0

  linux:
    name: Install test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Build AND runtime libraries in one go: the dev packages depend on
      # libwebkit2gtk-4.1-0 / libayatana-appindicator3-1, which install.sh's
      # ldd guard (Task 6) requires before it writes anything - deleting this
      # step thinking it is "build only" would fail the install itself.
      - name: Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ../dist is embedded at compile time (tauri.conf.json frontendDist),
      # so the web assets must be built before cargo.
      - name: Build the web assets (release)
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Build the Tauri binary (release)
        working-directory: desktop/src-tauri
        # custom-protocol = embedded assets instead of devUrl (see desktop.yml)
        run: cargo build --release --features tauri/custom-protocol

      - name: Stage the Tauri binary as OpenDrop
        run: |
          mkdir -p publish/linux
          cp desktop/src-tauri/target/release/opendrop publish/linux/OpenDrop
          chmod +x publish/linux/OpenDrop

      - name: Assemble the tarball (binary + src + wheels + install.sh)
        run: bash packaging/linux/build-tarball.sh ci

      - name: Extract the bundle
        run: tar -xzf dist/OpenDrop-ci-linux-x64.tar.gz

      - name: Python venv support (install.sh's venv hint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv

      - name: Seed user data (install marker + receive/share folders)
        run: |
          mkdir -p "$HOME/.opendrop" "$HOME/Downloads/OpenDrop/ci-recv" "$HOME/Downloads/OpenDrop/ci-share"
          printf '%s\n' "{\"ci_marker\":\"install-cycle\",\"download_directory\":\"$HOME/Downloads/OpenDrop/ci-recv\",\"share_directory\":\"$HOME/Downloads/OpenDrop/ci-share\"}" > "$HOME/.opendrop/config.json"
          echo "foreign file must survive uninstall" > "$HOME/.opendrop/marker.txt"
          echo seed > "$HOME/Downloads/OpenDrop/ci-recv/seed.txt"
          echo seed > "$HOME/Downloads/OpenDrop/ci-share/seed.txt"

      - name: Install (sudo ./install.sh)
        working-directory: OpenDrop
        run: sudo ./install.sh

      - name: Assert the installation
        run: |
          set -e
          test -x /opt/opendrop/OpenDrop || { echo "::error::binary missing or not executable in /opt/opendrop"; exit 1; }
          test -x /opt/opendrop/venv/bin/python || { echo "::error::venv python missing in /opt/opendrop"; exit 1; }
          test -f /opt/opendrop/web/index.html || { echo "::error::web/ missing in /opt/opendrop"; exit 1; }
          test -L /usr/local/bin/opendrop-desktop || { echo "::error::command symlink missing"; exit 1; }
          test "$(readlink /usr/local/bin/opendrop-desktop)" = "/opt/opendrop/OpenDrop" || { echo "::error::symlink does not point at /opt/opendrop/OpenDrop"; exit 1; }
          test -f /usr/share/applications/opendrop.desktop || { echo "::error::applications menu entry missing"; exit 1; }
          grep -q '^Exec=/usr/local/bin/opendrop-desktop' /usr/share/applications/opendrop.desktop || { echo "::error::menu Exec does not point at the symlink"; exit 1; }
          test -f /usr/share/icons/hicolor/256x256/apps/opendrop.png || { echo "::error::icon missing"; exit 1; }
          # No *.so assertions anymore: the Tauri binary ships none of its own
          # (zero was always legal) and the system libraries it needs were
          # already verified by install.sh's ldd guard.
          echo "install OK: binary + venv + web + symlink + menu entry + icon"

      - name: Server smoke (python --headless over HTTPS)
        run: |
          mkdir -p ~/.opendrop
          PYTHONPATH="$PWD/OpenDrop/src" /opt/opendrop/venv/bin/python -m opendrop.main --headless --port 8976 >/tmp/od-server.log 2>&1 &
          SERVER_PID=$!
          IP=$(hostname -I | awk '{print $1}')
          for i in $(seq 1 30); do ss -ltn 2>/dev/null | grep -q ':8976 ' && break; sleep 1; done
          if ! ss -ltn | grep -q ':8976 '; then cat /tmp/od-server.log; echo "::error::server not listening on 8976"; exit 1; fi
          if ! curl -sk --max-time 10 "https://$IP:8976/" -o /dev/null; then cat /tmp/od-server.log; echo "::error::no HTTP answer from the headless server"; exit 1; fi
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "server smoke OK: LISTEN + HTTP answer over HTTPS (headless, no GUI)"

      - name: Uninstall (sudo ./uninstall.sh) + assert both directions
        working-directory: OpenDrop
        run: |
          sudo ./uninstall.sh
          for p in /opt/opendrop /usr/local/bin/opendrop-desktop /usr/share/applications/opendrop.desktop /usr/share/icons/hicolor/256x256/apps/opendrop.png "$HOME/.opendrop/config.json"; do
            if [ -e "$p" ]; then echo "::error::should be gone after uninstall: $p"; exit 1; fi
          done
          for p in "$HOME/.opendrop/marker.txt" "$HOME/Downloads/OpenDrop/ci-recv/seed.txt" "$HOME/Downloads/OpenDrop/ci-share/seed.txt"; do
            if [ ! -e "$p" ]; then echo "::error::must survive uninstall: $p"; exit 1; fi
          done
          if [ ! -d "$HOME/.opendrop" ]; then echo "::error::~/.opendrop folder itself must survive (foreign marker inside)"; exit 1; fi
          echo "uninstall clean: app gone, config removed, foreign marker + receive/share folders intact"

      - name: Reinstall cycle + assert
        working-directory: OpenDrop
        run: |
          sudo ./install.sh
          test -x /opt/opendrop/OpenDrop || { echo "::error::binary missing after reinstall"; exit 1; }
          test -L /usr/local/bin/opendrop-desktop || { echo "::error::symlink missing after reinstall"; exit 1; }
          grep -q '^Exec=/usr/local/bin/opendrop-desktop' /usr/share/applications/opendrop.desktop || { echo "::error::menu Exec wrong after reinstall"; exit 1; }
          echo "reinstall cycle OK: binary back + executable + symlink + menu entry"
