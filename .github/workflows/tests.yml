name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # test_zip_web shells out to node; pin it so a runner-image change
      # cannot turn a green suite red for an environment reason.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the package
        run: python -m pip install -e .

      - name: Run the 10 test suites
        shell: bash
        run: |
          set -e
          for t in test_security test_routes test_paths test_quota test_sessions test_tls test_server test_beta test_devices test_zip_web; do
            echo "::group::$t"
            python -m tests.$t
            echo "::endgroup::"
          done
