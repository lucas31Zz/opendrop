name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # A cold Rust cache plus webkit2gtk compilation runs well past the old
    # 20-minute dotnet budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: opendrop.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: opendrop
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies (Tauri)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Type-check and build the web assets
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Build the Tauri application (release)
        working-directory: desktop/src-tauri
        run: cargo build --release

      # Bundling (installer + tarball) belongs to release.yml: this job only
      # proves that both legs compile the Tauri app.
      - uses: actions/upload-artifact@v7
        with:
          name: opendrop-${{ matrix.rid }}
          path: desktop/src-tauri/target/release/${{ matrix.exe }}
          retention-days: 7
