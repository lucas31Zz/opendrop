name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish the application (single-file, self-contained)
        run: dotnet publish desktop/OpenDrop/OpenDrop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/OpenDrop

      - name: Complete the bundle (Python server + web + docs)
        shell: bash
        run: |
          set -e
          cp pyproject.toml requirements.txt README.md LICENSE publish/OpenDrop/
          cp -R src publish/OpenDrop/src
          test -f publish/OpenDrop/web/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: opendrop-${{ matrix.rid }}
          path: publish/OpenDrop
          retention-days: 7
