name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # A cold Rust cache plus the webkit2gtk build runs well past 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: opendrop.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: opendrop
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies (Tauri)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Type-check and build the web assets
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      # The Rust suites (updater gates + spawn resolution) never ran in CI
      # until now: a green build only proved the code compiled.
      - name: Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the Tauri application (release)
        # `custom-protocol` is what flips tauri from devUrl to the embedded
        # assets (its build script computes `dev = !custom_protocol`): without
        # it even a --release binary renders ERR_CONNECTION_REFUSED, because
        # there is no vite server on localhost:1420 outside `tauri dev`.
        working-directory: desktop/src-tauri
        run: cargo build --release --features tauri/custom-protocol

      # Bundling (installer + tarball) belongs to release.yml: this job only
      # proves that both legs compile the Tauri app.
      - uses: actions/upload-artifact@v7
        with:
          name: opendrop-${{ matrix.rid }}
          path: desktop/src-tauri/target/release/${{ matrix.exe }}
          retention-days: 7
